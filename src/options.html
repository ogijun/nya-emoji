<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>kkhs nya emoji の設定</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2em auto; line-height: 1.6; }
    section { margin-bottom: 2em; }
    textarea { width: 100%; height: 8em; font-family: ui-monospace, monospace; }
    #preview img { height: 32px; margin: 2px; }
    .muted { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>kkhs nya emoji</h1>

  <section>
    <h2>1. 絵文字を取り込む</h2>
    <p>
      <a href="https://note.com/shikamatsu/n/nd217dc0617db" target="_blank" rel="noopener">しかまつさんの note</a>
      から zip を落として展開し、<code>all-nya</code> フォルダを選んでください。
      ファイル名（拡張子なし）がそのまま絵文字名になります（<code>bow-nya.png</code> → <code>:bow-nya:</code>）。
    </p>
    <input type="file" id="folder" webkitdirectory multiple>
    <p id="status" class="muted"></p>
    <div id="preview"></div>
  </section>

  <section>
    <h2>2. 表示するサイト</h2>
    <p class="muted">1行に1つ。<code>github.com</code> は完全一致、<code>*.esa.io</code> はサブドメインに一致。<code>#</code> で始まる行は無視。保存後、開いているタブは再読み込みしてください。</p>
    <textarea id="patterns"></textarea>
    <button id="save">保存</button> <span id="saved" class="muted"></span>
  </section>

  <script src="core.js"></script>
  <script src="options.js"></script>
</body>
</html>
